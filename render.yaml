services:
  - type: web
    name: projet-ados
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        sync: false # Définissez la valeur dans l'onglet Environment de Render
      - key: DB_FILE
        value: projet-ados.db
